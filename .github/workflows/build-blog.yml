name: Build blog

on:
  push:
    branches:
      - master
    paths:
      - "posts/**/*.md"
      - "scripts/build.py"
      - "css/main.css"
      - "js/site.js"
      - ".github/workflows/build-blog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build HTML
        run: python3 scripts/build.py

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html posts
          git diff --cached --quiet || git commit -m "build blog pages"
          git push
